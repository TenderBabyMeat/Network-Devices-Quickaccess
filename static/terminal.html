<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web SSH</title>
<link rel="stylesheet" href="/static/app.css?v=__VERSION__">
<link rel="stylesheet" href="/static/vendor/xterm.css?v=__VERSION__">
<link rel="stylesheet" href="/static/terminal.css?v=__VERSION__">
</head>
<body class="term-page">
<div class="term-bar">
  <span class="dot checking" id="stateDot"></span>
  <b id="devName">Web SSH</b>
  <span class="mono muted" id="devTarget"></span>
  <span class="muted" id="stateText">Connecting…</span>
  <span style="flex:1"></span>
  <button class="small" id="btnReconnect" hidden>Reconnect</button>
</div>
<div id="term"></div>

<div class="overlay" id="overlay" hidden>
  <form class="prompt-card" id="promptForm" autocomplete="off">
    <h3 id="pTitle"></h3>
    <div id="pBody"></div>
    <input id="pInput" hidden>
    <div class="msg" id="pMsg"></div>
    <div class="dlg-actions">
      <button type="button" id="pCancel">Cancel</button>
      <button type="submit" class="primary" id="pOk">OK</button>
    </div>
  </form>
</div>

<script src="/static/vendor/xterm.js?v=__VERSION__"></script>
<script src="/static/vendor/addon-fit.js?v=__VERSION__"></script>
<script src="/static/terminal.js?v=__VERSION__"></script>
</body>
</html>
