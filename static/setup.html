<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up · __TITLE__</title>
<link rel="stylesheet" href="/static/app.css?v=__VERSION__">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="loginForm" data-mode="setup">
    <h1>Welcome to NetDevices</h1>
    <p>Your homelab dashboard. Choose the password you'll use to log in. The setup code proves you're the one who installed it.
       <code>setup.sh</code> printed it; it's also in <span class="mono">docker compose logs netdevices</span>.</p>
    <div class="field">
      <label for="code">Setup code</label>
      <input id="code" class="mono" autocomplete="off" placeholder="XXXX-XXXX-XXXX" required autofocus>
    </div>
    <div class="field">
      <label for="pw">Password (8+ characters)</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="pw2">Repeat password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="primary">Create login</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<div class="ver">NetDevices v__VERSION__</div>
<script src="/static/auth.js?v=__VERSION__"></script>
</body>
</html>
